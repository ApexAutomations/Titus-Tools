<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <!-- Icon Mark (cross/grid pattern with dots) -->
  <!-- Top: 3 vertical bars -->
  <rect x="8"  y="2"  width="5" height="16" rx="2.5" fill="white"/>
  <rect x="16" y="2"  width="5" height="16" rx="2.5" fill="white"/>
  <rect x="24" y="2"  width="5" height="16" rx="2.5" fill="white"/>

  <!-- Left: 3 horizontal bars -->
  <rect x="2"  y="8"  width="16" height="5" rx="2.5" fill="white"/>
  <rect x="2"  y="16" width="16" height="5" rx="2.5" fill="white"/>
  <rect x="2"  y="24" width="16" height="5" rx="2.5" fill="white"/>

  <!-- Center: 3x3 dot grid -->
  <circle cx="23" cy="22" r="2.2" fill="white"/>
  <circle cx="30" cy="22" r="2.2" fill="white"/>
  <circle cx="37" cy="22" r="2.2" fill="white"/>
  <circle cx="23" cy="29" r="2.2" fill="white"/>
  <circle cx="30" cy="29" r="2.2" fill="white"/>
  <circle cx="37" cy="29" r="2.2" fill="white"/>
  <circle cx="23" cy="36" r="2.2" fill="white"/>
  <circle cx="30" cy="36" r="2.2" fill="white"/>
  <circle cx="37" cy="36" r="2.2" fill="white"/>

  <!-- Bottom: 3 vertical bars -->
  <rect x="8"  y="42" width="5" height="16" rx="2.5" fill="white"/>
  <rect x="16" y="42" width="5" height="16" rx="2.5" fill="white"/>
  <rect x="24" y="42" width="5" height="16" rx="2.5" fill="white"/>

  <!-- Wordmark: "titus" -->
  <text x="52" y="40" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="32" font-weight="800" letter-spacing="-1" fill="white">titus</text>

  <!-- Sub: "TALENT STRATEGIES" -->
  <text x="53" y="54" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#8A9BAD">TALENT STRATEGIES</text>
</svg>
